name: Purge jsDelivr Cache

on:
  push:
    branches:
      - master
    paths:
      - 'rule/**'               # 仅当 rule 文件夹及子目录内的文件变动时触发
      # - 'rule_provider/**'    # 如有其他目录可在此按需追加

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed files and purge jsDelivr cache
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)

          if [ -z "$CHANGED_FILES" ]; then
            echo "没有检测到文件变动，跳过缓存刷新。"
            exit 0
          fi

          echo "本次修改的文件:"
          echo "$CHANGED_FILES"

          for file in $CHANGED_FILES; do
            PURGE_URL="https://purge.jsdelivr.net/gh/${{ github.repository }}@${{ github.ref_name }}/$file"
            echo "正在刷新缓存: $PURGE_URL"
            
            RESPONSE=$(curl -s "$PURGE_URL")
            echo "返回结果: $RESPONSE"
          done
